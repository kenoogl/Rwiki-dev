steps:
  primary_detection:
    rules:
      - finding_suffix: finding-boundary
        severity: high
        source_role: primary_reviewer
        required_evidence_types:
          - implementation.boundary_condition_semantics
        required_source_kinds:
          - implementation_snapshot
          - upstream_spec
        required_section_classes:
          - snapshot_rationale
          - acceptance_criteria
        structural_source_requirements:
          - source_kind: implementation_snapshot
            section_class: snapshot_rationale
            section_heading_patterns:
              - "^4\\. Why This Snapshot$"
            line_prefix_patterns:
              - "^3$"
            evidence_type: implementation.boundary_condition_semantics
            review_focus: boundary_condition
          - source_kind: upstream_spec
            section_class: acceptance_criteria
            fragment_class: boundary_contract
            evidence_type: implementation.boundary_condition_semantics
            review_focus: boundary_condition
        failure_observation_refs:
          - implementation:boundary_condition_semantics
        summary_prefix: Boundary-condition semantics are review-critical because mismatches between upstream rules and implementation behavior can invalidate execution results or downstream interpretation.
      - finding_suffix: finding-update-order
        severity: medium
        source_role: primary_reviewer
        required_evidence_types:
          - implementation.update_ordering_state_mutation
        required_source_kinds:
          - implementation_snapshot
          - upstream_spec
        required_section_classes:
          - snapshot_rationale
          - acceptance_criteria
        structural_source_requirements:
          - source_kind: implementation_snapshot
            section_class: snapshot_rationale
            section_heading_patterns:
              - "^4\\. Why This Snapshot$"
            line_prefix_patterns:
              - "^3$"
            evidence_type: implementation.update_ordering_state_mutation
            review_focus: update_ordering
          - source_kind: upstream_spec
            section_class: acceptance_criteria
            fragment_class: update_order_contract
            evidence_type: implementation.update_ordering_state_mutation
            review_focus: update_ordering
        failure_observation_refs:
          - implementation:update_ordering_state_mutation
        summary_prefix: Update ordering and state mutation risk should be inspected because explicit execution sequences can drift from their upstream specification and silently change downstream behavior.
  adversarial_review:
    rules:
      - finding_suffix: finding-parameter-caveat
        severity: medium
        source_role: adversarial_reviewer
        allowed_fragment_classes:
          - boundary_review_rationale
          - parameter_review_rationale
          - clean_room_constraint_note
          - digest_fixity_note
          - parameter_contract
          - update_order_review_rationale
        allowed_counter_fragment_classes:
          - parameter_contract
        required_evidence_types:
          - implementation.parameter_default_semantics
          - implementation.parameter_caveat_surface
        required_counter_evidence_types:
          - implementation.parameter_default_semantics
        required_source_kinds:
          - implementation_snapshot
          - upstream_spec
        required_counter_source_kinds:
          - upstream_spec
        required_section_classes:
          - snapshot_rationale
          - acceptance_criteria
        required_counter_section_classes:
          - acceptance_criteria
        structural_source_requirements:
          - source_kind: implementation_snapshot
            section_class: snapshot_rationale
            section_heading_patterns:
              - "^4\\. Why This Snapshot$"
            line_prefix_patterns:
              - "^3$"
            evidence_type: implementation.parameter_default_semantics
            review_focus: parameter_interpretation
          - source_kind: implementation_snapshot
            section_class: snapshot_rationale
            section_heading_patterns:
              - "^4\\. Why This Snapshot$"
            line_prefix_patterns:
              - "^3$"
            evidence_type: implementation.parameter_caveat_surface
            review_focus: parameter_interpretation
          - source_kind: implementation_snapshot
            section_class: implementation_snapshot_note
            fragment_class: clean_room_constraint_note
            section_heading_patterns:
              - "^3\\.2 Code-Side Anchor$"
            bullet_ordinals:
              - 4
            evidence_type: implementation.parameter_caveat_surface
            review_focus: parameter_interpretation
          - source_kind: implementation_snapshot
            section_class: implementation_snapshot_note
            fragment_class: clean_room_constraint_note
            section_heading_patterns:
              - "^8\\. Caveats$"
            line_prefix_patterns:
              - "^3$"
            evidence_type: implementation.parameter_caveat_surface
            review_focus: parameter_interpretation
          - source_kind: implementation_snapshot
            section_class: implementation_snapshot_note
            fragment_class: digest_fixity_note
            section_heading_patterns:
              - "^3\\.2 Code-Side Anchor$"
            bullet_ordinals:
              - 7
            evidence_type: implementation.parameter_caveat_surface
            review_focus: parameter_interpretation
          - source_kind: implementation_snapshot
            section_class: implementation_snapshot_note
            fragment_class: digest_fixity_note
            section_heading_patterns:
              - "^8\\. Caveats$"
            line_prefix_patterns:
              - "^2$"
            evidence_type: implementation.parameter_caveat_surface
            review_focus: parameter_interpretation
          - source_kind: implementation_snapshot
            section_class: implementation_snapshot_note
            fragment_class: evidence_exclusion_note
            section_heading_patterns:
              - "^8\\. Caveats$"
            line_prefix_patterns:
              - "^4$"
            evidence_type: implementation.parameter_caveat_surface
            review_focus: parameter_interpretation
          - source_kind: upstream_spec
            section_class: acceptance_criteria
            fragment_class: parameter_contract
            evidence_type: implementation.parameter_default_semantics
            review_focus: parameter_interpretation
        structural_counter_requirements:
          - source_kind: upstream_spec
            section_class: acceptance_criteria
            fragment_class: parameter_contract
            evidence_type: implementation.parameter_default_semantics
            review_focus: parameter_interpretation
        source_pattern_ids:
          - seed.parameter-defaults
          - seed.parameter-caveat-surface
        counter_evidence_pattern_ids:
          - seed.parameter-defaults
        failure_observation_refs:
          - implementation:parameter_interpretation_drift
        summary_prefix: Parameter interpretation remains adversarially review-worthy because defaults, CLI meaning, and reconstruction caveats can diverge unless the mapping from upstream sources to implementation behavior is made explicit.
