# metadata_contract.yaml
# dual-reviewer-foundation Requirement 1 受入 5／Requirement 6（受入 1〜10）／
# Requirement 7 受入 3／Requirement 2 受入 4／design「Domain Model §3」「§9」
#
# run-level metadata の field list・enum・責務分離を固定する。
# validator と evaluation はこれを正本として読む。

version: "1.0.0"

# run_status / validator_status / human_signoff_status / evidence_class は
# 別概念であり混同しない（design Decision 2／§3／§9）。
responsibility_separation:
  run_status: "runtime lifecycle 状態のみを表す"
  validator_status: "mechanical validation の結果のみを表す"
  human_signoff_status: "operator decision の状態のみを表す"
  evidence_class: "downstream consumption 上の区分のみを表す"
  note: >
    実行は閉じたが invalid／実行は閉じたが exploratory／human sign-off 未完了、
    といった状態を混同しない。run_status=closed かつ validator_status=passed でも
    evidence_class=exploratory は成立しうる（design §9）。

provenance_roles:
  source_repository_id: "どの local repository で evidence が採取されたか"
  source_revision: "どの source revision で evidence が採取されたか"
  target_id: "review 対象 artifact の識別子"
  target_artifact_hash: "review 対象 artifact 自体の固定子"

rules:
  missing_required_metadata_is_validator_failure: true   # Requirement 6 受入 4
  metadata_alone_can_exclude_invalid_run: true            # Requirement 6 受入 5
  phase_profile_value_vocab_owned_by_runtime: true        # Requirement 1 受入 8
  treatment_value_vocab_owned_by_runtime: true            # Requirement 1 受入 9

fields:
  run_id:
    purpose: "run の安定識別子"
    required: true
  target_id:
    purpose: "review 対象識別子"
    required: true
  target_artifact_hash:
    purpose: "対象固定のための hash"
    required: true
  source_repository_id:
    purpose: "evidence が採取された repository の識別子"
    required: true
  source_revision:
    purpose: "evidence 採取時の source revision"
    required: true
  phase_profile:
    purpose: "phase/profile 識別。値語彙は runtime 所有（foundation は列挙しない）"
    required: true
  treatment:
    purpose: "treatment 識別。値語彙は runtime 所有（foundation は列挙しない）"
    required: true
  review_mode:
    purpose: "review 実施モード"
    required: true
    enum: [manual_dogfooding, runtime_mediated]
  protocol_version:
    purpose: "protocol drift 防止"
    required: true
  runtime_version:
    purpose: "runtime 挙動追跡"
    required: true
  schema_set_version:
    purpose: "schema 群の整合追跡"
    required: true
  prompt_set_version:
    purpose: "prompt 群の整合追跡"
    required: true
  config_version:
    purpose: "当該 run を生成した config の版（Requirement 7 受入 3）"
    required: true
  config_hash:
    purpose: "config 内容固定のための hash（Requirement 2 受入 4）"
    required: true
  run_status:
    purpose: "runtime lifecycle 状態"
    required: true
    enum: [created, in_progress, closed, orchestration_failed]
  validator_status:
    purpose: "mechanical validation の結果（pass / fail / blocked）"
    required: true
    enum: [not_run, passed, failed, blocked]
  human_signoff_status:
    purpose: "operator sign-off 状態"
    required: true
    enum: [pending, approved, rejected, deferred]
  evidence_class:
    purpose: "downstream consumption 区分"
    required: true
    enum: [candidate, valid, invalid, exploratory]
  started_at:
    purpose: "run 開始時刻"
    required: true
  closed_at:
    purpose: "run 終了時刻"
    required: false

# foundation が canonical source として所有する語彙（downstream は再定義せず参照）。
canonical_ownership:
  validator_status: [not_run, passed, failed, blocked]      # Requirement 6 受入 10
  evidence_class: [candidate, valid, invalid, exploratory]   # Requirement 6 受入 8
  candidate_note: >
    candidate は runtime close 直後の未確定状態。validator_status と
    human_signoff_status が揃った後に valid / invalid / exploratory へ遷移する。
