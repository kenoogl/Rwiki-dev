version: 1.0.0
review_modes:
  - mode: manual_dogfooding
    producer: human_operator
    description: Manual application of the dual-reviewer method without runtime orchestration.
  - mode: runtime_mediated
    producer: runtime
    description: Evidence produced by the in-repo runtime orchestration path.
  - mode: imported_bundle
    producer: external_runtime
    description: Evidence imported from a portable bundle produced in another local repository.
